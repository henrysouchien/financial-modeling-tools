[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-model-engine"
version = "0.1.0"
description = "Financial model schema analysis tools and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0",
  "openpyxl>=3.1",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
fmp = [
  "fmp-mcp>=0.3.3",
]

[project.scripts]
financial-model-engine = "model_engine_mcp_server:main"

[tool.setuptools]
py-modules = ["bootstrap_env", "model_engine_mcp_server"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api",
  "api.*",
  "mcp_servers",
  "mcp_servers.*",
  "schema",
  "schema.*",
]
exclude = [
  "schema.baselines",
  "schema.scratchpad",
]

[tool.setuptools.package-data]
schema = [
  "*.json",
  "*.yaml",
  "templates/*.json",
  "templates/*.yaml",
  "strategy_categories/*.yaml",
]
